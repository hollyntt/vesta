name: Build & Auto-Release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate version from commit count
        id: version
        run: |
          $commitsSinceLastTag = git rev-list --count "$(git describe --tags --abbrev=0 2>$null || echo 'HEAD~100')"..HEAD
          $version = "v1.2.$($commitsSinceLastTag + 3)"
          echo "tag=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          echo "Generated version: $version"
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: vesta-windows-x64
          path: build/bin/vesta.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $asset = "build/bin/vesta.exe"
          $sha256 = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          
          # Check if release already exists
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, updating..."
            gh release upload $tag $asset --clobber
          } else {
            Write-Host "Creating new release $tag..."
            $notes = @"
## Auto Release $tag

Built automatically from commit [$env:GITHUB_SHA.Substring(0,7)]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA)

**SHA-256:** \``$sha256\`\`

[GitHub Actions Run]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)
"@
            gh release create $tag --title "Auto Release $tag" --notes $notes $asset
          }
          Write-Host "Released $tag successfully"