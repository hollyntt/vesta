name: Build & Auto-Release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate version from commit SHA
        id: version
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $version = "#$shortSha"
          echo "tag=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: vesta-windows-x64
          path: build/bin/vesta.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download executable artifact
        uses: actions/download-artifact@v7
        with:
          name: vesta-windows-x64
          path: build/bin
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $asset = "build/bin/vesta.exe"
          
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating existing release $tag..."
            gh release upload $tag $asset --clobber
          } else {
            Write-Host "Creating new release $tag..."
            $ghUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $notes = "## Auto Release $tag`n`nCommit: $env:GITHUB_SHA`nSHA-256: $sha256`n`nAction Run: $ghUrl"
            gh release create $tag --title $tag --notes $notes $asset
          }
          Write-Host "Released $tag successfully"
