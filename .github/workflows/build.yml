name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve target repository
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          try {
            $info = gh api --jq .parent.full_name "repos/$repo"
            if ($info) { $repo = $info }
          } catch {}
          "target=$repo" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: vesta-windows-x64
          path: build/bin/vesta.exe
          if-no-files-found: error
