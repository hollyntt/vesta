name: Test Release
on:
  push:
    tags: ["v*"]
jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Debug context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Tag: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
      - name: Build check
        run: |
          if (Test-Path "vesta.exe") {
            echo "vesta.exe exists"
          } else {
            echo "vesta.exe NOT found - will need to build"
          }