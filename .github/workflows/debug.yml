name: Debug Tag Context
on:
  push:
    tags: ["v*"]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print GitHub Context
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"
          echo "ref_name: ${{ github.ref_name }}"
          echo "ref_type: ${{ github.ref_type }}"
